<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лагерь — макет сумки</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172117;color:#f4e5c7;font-family:Georgia,serif;display:grid;min-height:100vh;place-items:center}.screen{width:min(100vw,177.7vh);aspect-ratio:16/9;position:relative;background:url('Camp_Inventory_Art.png') center/100% 100%;container-type:inline-size}.grid{position:absolute;left:44.6%;top:23%;width:42%;height:64%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,1fr);gap:.45cqw;background:#251d14}.cell{cursor:pointer;color:#f8e8c9;border:2px solid #58432d;border-radius:3px;background:linear-gradient(135deg,#30291e,#15140f);box-shadow:inset 0 0 0 2px #19160f,inset 0 3px 7px #080a08;position:relative;padding:6%;min-width:0}.cell:hover{border-color:#d8b785;background:#403523}.cell.selected{border-color:#ffe4ae;box-shadow:0 0 9px #bd864b,inset 0 0 0 2px #765435}.cell svg{width:100%;height:100%;filter:drop-shadow(2px 3px 2px #000)}.count{position:absolute;right:14.7%;top:17%;font-size:1.5cqw;background:#261e15;padding:.3cqw}.details{position:absolute;left:17.9%;top:69.5%;width:22%;height:13.3%;background:#201a12;padding:.6cqw;font-size:1.15cqw}.details strong{display:block;color:#ffe6b2;font-size:1.5cqw;margin-bottom:.4cqw}.row{display:flex;justify-content:space-between;padding:.1cqw}.gain{color:#b6dc86}.actions{position:absolute;left:14.2%;top:83.5%;width:25.5%;height:5%;display:flex;gap:1cqw}button.action{font: bold 1.3cqw Georgia;color:#fff0ce;flex:1;border:2px solid #9a7446;background:linear-gradient(#963c25,#632718);cursor:pointer;box-shadow:inset 0 0 0 2px #442619}.action:hover{filter:brightness(1.2)}button:focus-visible{outline:3px solid #fff5cf}.equipment{position:absolute;left:13.2%;top:21.2%;width:4.3%;height:41.3%;display:grid;grid-template-rows:repeat(5,1fr);gap:1cqw}.equipment .cell{padding:4%}.notice{position:absolute;left:44.8%;top:88%;font:1cqw Arial;color:#e0ceb1}.badge{position:absolute;bottom:0;right:.4%;font:10px Arial;color:#fff;background:#233321;padding:4px}.closed{display:none}.open{position:absolute;left:43%;top:45%;padding:20px;font:20px Georgia;background:#793822;color:#fff0ce;border:2px solid #e1bd87;cursor:pointer}.empty{opacity:.3}
</style>
<div class="screen" id="screen"><div id="panel"><div class="count" id="count"></div><div class="equipment" id="equipment"></div><div class="grid" id="grid"></div><div class="details" id="details"></div><div class="actions"><button class="action" id="equip">НАДЕТЬ</button><button class="action" id="remove">СНЯТЬ</button></div><div class="notice" id="notice">Выберите предмет · двойной клик — надеть</div></div><button class="open closed" id="open">Открыть сумку [I]</button><div class="badge">Интерактивный макет • примерные предметы и числа • не сохранение игры</div></div>
<style>.equipment{background:#261e15;gap:.6cqw}.equipment .cell{min-height:0}.equipment .cell svg{display:block}.details{font-family:Georgia,serif}</style>
<script>
const paths=[`<path d="M22 75L68 16Q82 4 79 20L33 80Z" fill="#dcdccc"/><path d="M20 64L42 84M18 87L30 75" stroke="#b99457" stroke-width="7"/>`,`<path d="M30 20L42 12L58 12L70 20L88 43L70 54L65 42L66 87L33 87L34 42L28 54L10 43Z" fill="#e4dbc0"/><path d="M43 13L57 30L43 68M32 69L66 69" fill="none" stroke="#bd5b49" stroke-width="8"/>`,`<path d="M25 10Q20 60 50 59Q80 60 75 10" fill="none" stroke="#bba47b" stroke-width="4"/><path d="M50 48L67 68L50 91L33 68Z" fill="#a3ba64" stroke="#dbc795" stroke-width="4"/>`,`<ellipse cx="50" cy="58" rx="26" ry="29" fill="none" stroke="#bc925b" stroke-width="10"/><path d="M40 24L60 24L65 38L50 48L35 38Z" fill="#bcc884" stroke="#f1d29d" stroke-width="3"/>`,`<path d="M52 8L73 51L61 89L30 77L22 46Z" fill="#c16e59" stroke="#e6b4a0" stroke-width="3"/><path d="M52 8L46 56L61 89M22 46L46 56L73 51" fill="none" stroke="#f3cab6" stroke-width="3"/>`];
const icon=t=>`<svg viewBox="0 0 100 100" aria-hidden="true">${paths[t]}</svg>`;
const labels=['Оружие','Броня','Талисман','Кольцо','Артефакт'];
const item=(name,type,value)=>({name,type,value});
let bag=Array(48).fill(null);bag.splice(0,8,item('Сабля странника',0,23),item('Льняная куртка',1,14),item('Медное кольцо',3,12),item('Лесной талисман',2,8),item('Осколок памяти',4,3),item('Старая сабля',0,16),item('Походный клинок',0,21),item('Кольцо проводника',3,16));
let worn=[item('Сабля Пелага',0,18),item('Походная куртка',1,12),item('Талисман тропы',2,5),item('Простое кольцо',3,8),item('Тусклый осколок',4,2)];let selected=0,selectedSlot=0;
const stats=['Урон','Броня','Сопротивление огню','Здоровье','Урон'];
function render(){document.getElementById('grid').innerHTML=bag.map((v,i)=>`<button class="cell ${i===selected?'selected':''}" aria-label="${v?v.name:'Пустая ячейка '+(i+1)}" data-i="${i}">${v?icon(v.type):''}</button>`).join('');document.getElementById('equipment').innerHTML=worn.map((v,i)=>`<button class="cell ${selected<0&&selectedSlot===i?'selected':''}" data-slot="${i}" aria-label="${labels[i]}: ${v?v.name:'пусто'}">${v?icon(v.type):'<span class="empty">◇</span>'}</button>`).join('');document.getElementById('count').textContent=bag.filter(Boolean).length+' / 48';let v=selected>=0?bag[selected]:worn[selectedSlot];let old=v?worn[v.type]:null;document.getElementById('details').innerHTML=v?`<strong>${v.name}</strong><div class="row"><span>${labels[v.type]}</span><span>${selected<0?'Надето':'Выбрано'}</span></div><div class="row"><span>${stats[v.type]}</span><span>${old?old.value:0} → ${v.value} <b class="gain">${v.value-(old?old.value:0)>0?'+'+(v.value-(old?old.value:0)):''}</b></span></div>`:'<strong>Пустая ячейка</strong><span>Выберите предмет для сравнения</span>';}
function equip(){let v=bag[selected];if(!v)return;bag[selected]=worn[v.type];worn[v.type]=v;selectedSlot=v.type;document.getElementById('notice').textContent='Надето: '+v.name;render()}
document.getElementById('grid').onclick=e=>{let b=e.target.closest('[data-i]');if(b){selected=+b.dataset.i;render()}};document.getElementById('grid').ondblclick=e=>{let b=e.target.closest('[data-i]');if(b){selected=+b.dataset.i;equip()}};document.getElementById('equipment').onclick=e=>{let b=e.target.closest('[data-slot]');if(b){selectedSlot=+b.dataset.slot;selected=-1;render()}};document.getElementById('equip').onclick=equip;document.getElementById('remove').onclick=()=>{let slot=selected<0?selectedSlot:bag[selected]?.type;if(slot==null||!worn[slot])return;let free=bag.indexOf(null);if(free<0){document.getElementById('notice').textContent='Сумка заполнена';return}bag[free]=worn[slot];worn[slot]=null;selected=free;render()};let visible=true;function toggle(){visible=!visible;document.getElementById('panel').classList.toggle('closed',!visible);document.getElementById('open').classList.toggle('closed',visible);document.getElementById('screen').style.backgroundImage=visible?"url('Camp_Inventory_Art.png')":"linear-gradient(135deg,#263a24,#65714a)"}document.getElementById('open').onclick=toggle;document.onkeydown=e=>{if(e.code==='KeyI'||e.code==='Escape'&&visible)toggle()};render();
</script><link rel="stylesheet" href="Camp_Inventory_v2.css"><script src="Camp_Inventory_drag.js"></script></html>
