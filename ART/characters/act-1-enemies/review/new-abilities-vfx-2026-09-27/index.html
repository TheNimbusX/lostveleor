<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новые способности мобов · эффекты</title>
<style>:root{color-scheme:dark;--bg:#141b19;--panel:#202925;--line:#3b473e;--ink:#eae9df;--muted:#b3beb1;--accent:#cad69d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",sans-serif}main{max-width:1400px;margin:auto;padding:36px 32px 70px}h1{font-size:36px;margin:8px 0 10px;font-weight:650}h2{font-size:26px;margin:40px 0 12px;padding-top:20px;border-top:1px solid var(--line);font-weight:620}p{color:var(--muted);max-width:75ch}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}.card{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}.card img{display:block;width:100%}figcaption{padding:12px 14px;display:flex;flex-direction:column;gap:4px}figcaption span{color:var(--muted);font-size:14px}@media (max-width:700px){main{padding:24px 16px}.grid{grid-template-columns:1fr}}</style>
<main><p class="eyebrow">Лес · новые способности · 27 сентября 2026</p><h1>Эффекты: лечение, кислая лужа, перекат</h1><p>Целевые кадры поверх нашего кадра игры. По выбранному соберу эффект из паков CFXR/Hovl. Выбери по одному на способность.</p><section><h2>Корнехват — лечение «Волна из корней»</h2><div class="grid"><figure class="card"><a href="mend-1.jpg" target="_blank"><img src="mend-1.jpg" alt="1. Золотисто-зелёное кольцо"></a><figcaption><strong>1. Золотисто-зелёное кольцо</strong><span>От вонзённых лап по земле расходится кольцо с корешками, листья и искры, на союзниках раскрываются листочки.</span></figcaption></figure><figure class="card"><a href="mend-2.jpg" target="_blank"><img src="mend-2.jpg" alt="2. Светящиеся корни-нити"></a><figcaption><strong>2. Светящиеся корни-нити</strong><span>От лап к каждому союзнику бегут нити-корни, под ними цветёт мох, поднимаются искры.</span></figcaption></figure></div></section><section><h2>Плюй-плод — кислая лужа</h2><div class="grid"><figure class="card"><a href="puddle-1.jpg" target="_blank"><img src="puddle-1.jpg" alt="1. Лужа с тёмной кромкой"></a><figcaption><strong>1. Лужа с тёмной кромкой</strong><span>Пузырящийся сок, куски лопнувшего плода, тёмный земляной край — хорошо читается на траве.</span></figcaption></figure><figure class="card"><a href="puddle-2.jpg" target="_blank"><img src="puddle-2.jpg" alt="2. Плоская кляксa"></a><figcaption><strong>2. Плоская кляксa</strong><span>Светящаяся кислая клякса, брызги вокруг, лёгкая зелёная дымка.</span></figcaption></figure></div></section><section><h2>Расщепень — перекат клубком</h2><div class="grid"><figure class="card"><a href="roll-1.jpg" target="_blank"><img src="roll-1.jpg" alt="1. Замах: сжатие и борозда"></a><figcaption><strong>1. Замах: сжатие и борозда</strong><span>Сжимается в шар с пылью под собой, впереди — продавленная борозда в траве точно по пути переката (вместо обычной полосы-метки).</span></figcaption></figure><figure class="card"><a href="roll-2.jpg" target="_blank"><img src="roll-2.jpg" alt="2. Сам перекат"></a><figcaption><strong>2. Сам перекат</strong><span>Шар панциря катится, за ним вырванный дёрн, пыль и листья.</span></figcaption></figure></div></section></main></html>
